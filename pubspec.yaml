name: paypadi

description: "A new Flutter project."

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: 3.44.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0
  auto_route: ^11.1.0
  flutter_svg: ^2.0.10+1
  pin_code_text_field: ^1.8.0
  local_auth: ^3.0.0
  package_info_plus: ^10.1.0
  retrofit: ^4.4.2
  dio: ^5.8.0+1
  talker_dio_logger: ^5.0.0
  talker_flutter: ^5.0.0
  talker_riverpod_logger: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.1.0
  screenshot: ^3.0.0
  flutter_to_pdf: ^0.4.1
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^5.0.0
  toastification: ^3.0.3
  flutter_screenutil: ^5.9.3
  mobile_scanner: ^7.1.3
  loading_animation_widget: ^1.3.0
  skeletonizer: ^2.1.2
  file_picker: ^12.0.0-beta.5
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  pretty_qr_code: ^3.6.0
  sentry_flutter: ^9.21.0
  sentry_dio: ^9.21.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  
dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter

  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.0.3
  build_runner: ^2.12.0
  retrofit_generator: ^10.0.0
  auto_route_generator: ^10.0.1
  riverpod_generator: ^4.0.0+1
  flutter_gen_runner: ^5.14.1
  freezed: ^3.0.6
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/colors.xml

  fonts:
    - family: DM Sans
      fonts:
        - asset: fonts/DMSans-Variable.ttf

    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf

flutter_gen:
  output: lib/config/gen/

  assets:
    outputs:
      class_name: AppAssets
      directory_path_enabled: true

  integrations:
    image: true
    flutter_svg: true

  colors:
    inputs:
      - assets/colors.xml
    outputs:
      class_name: AppColors

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: paypadi
  org: tmdc
