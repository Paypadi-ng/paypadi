name: Paypadi Deploy — Dev

# Every merge to main ships a dev-flavor build (com.paypadi.dev) to
# Firebase App Distribution and the Play Store internal track.
# The `dev` environment only accepts deployments from `main`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        required: true
        default: all
        options: [all, android, ios]

permissions:
  contents: read

# Queue rather than cancel: cancelling mid-upload can leave a store
# release half-created.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  # ─── Validation ─────────────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/validate.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Android ────────────────────────────────────────────────────────────────
  android-dev:
    name: Android — Dev
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          setup-java: "true"
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Secrets are written to $RUNNER_TEMP (outside the workspace) so they
      # can never be swept up by an artifact upload.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key-dev.properties

      - name: Build App Bundle — dev
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle \
            --flavor dev \
            --target lib/main_dev.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DEPLOY_ENV=dev \
            --build-number="$BUILD_NUMBER" \
            --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-dev-r${{ github.run_number }}.aab
          path: build/app/outputs/bundle/devRelease/app-dev-release.aab
          retention-days: 14

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-credentials.json"

      - name: Deploy to Firebase App Distribution
        run: bundle exec fastlane android deploy_firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_GROUPS: dev-testers
          RELEASE_NOTES: "Dev build r${{ github.run_number }} (${{ github.sha }})"
          ARTIFACT_PATH: build/app/outputs/bundle/devRelease/app-dev-release.aab

      - name: Deploy to Play Store — Internal Testing track
        run: bundle exec fastlane android deploy_playstore_internal
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

  # ─── iOS ────────────────────────────────────────────────────────────────────
  # Disabled until the repository variable IOS_DEPLOY_ENABLED is set to
  # 'true' — the Apple team IDs in fastlane/Appfile and the ExportOptions
  # plists still need to be provided.
  ios-dev:
    name: iOS — Dev
    needs: validate
    runs-on: macos-15
    environment: dev
    if: >-
      vars.IOS_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync dev certificates via Match
        run: bundle exec fastlane ios sync_dev_certs
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Build IPA — dev
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build ipa \
            --flavor dev \
            --target lib/main_dev.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DEPLOY_ENV=dev \
            --build-number="$BUILD_NUMBER" \
            --release \
            --export-options-plist=ios/ExportOptionsDev.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-dev-r${{ github.run_number }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-credentials.json"

      - name: Deploy to Firebase App Distribution
        run: bundle exec fastlane ios deploy_firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_GROUPS: dev-testers
          RELEASE_NOTES: "Dev build r${{ github.run_number }} (${{ github.sha }})"
