name: Paypadi Release — Prod

# Production release: push a `vX.Y.Z` tag on a commit that is on main.
# • Only repo admins can create `v*` tags (tag ruleset).
# • The `prod` environment only accepts `v*` tags and waits for a reviewer.
# • Android goes to the Play production track as a staged rollout
#   (PLAY_ROLLOUT, default 10%); raise it in the Play Console.
# • iOS is submitted for App Store review; release it manually in App Store
#   Connect once Apple approves.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Re-run a platform for an existing tag (select the tag as the ref)
    inputs:
      platform:
        description: "Target platform"
        type: choice
        required: true
        default: all
        options: [all, android, ios]

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  # ─── Validation ─────────────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/validate.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Version ────────────────────────────────────────────────────────────────
  version:
    name: Verify release tag
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches pubspec and is on main
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Prod releases must run from a v* tag (got $GITHUB_REF)"
            exit 1
          fi

          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Promote it dev → staging → main first."
            exit 1
          fi

          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"

  # ─── Android ────────────────────────────────────────────────────────────────
  android-prod:
    name: Android — Prod → Play production (staged rollout)
    needs: [validate, version]
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency caches in release builds (cache-poisoning protection).
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          setup-java: "true"
          setup-ruby: "true"
          cache: "false"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure upload signing
        uses: ./.github/actions/android-signing
        with:
          flavor: prod
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build App Bundle — prod
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BUILD_NAME: ${{ needs.version.outputs.version }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          flutter build appbundle \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --build-number="$(( GITHUB_RUN_NUMBER + ${BUILD_NUMBER_OFFSET:-0} ))" \
            --build-name="$BUILD_NAME" \
            --release

      - name: Upload debug symbols to Sentry
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-prod-r${{ github.run_number }}.aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90

      - name: Release to Play Store — production (staged rollout)
        run: bundle exec fastlane android deploy_prod
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_ROLLOUT: ${{ vars.PLAY_ROLLOUT || '0.1' }}

  # ─── iOS ────────────────────────────────────────────────────────────────────
  # Disabled until IOS_DEPLOY_ENABLED is 'true' (see deploy-dev.yml).
  ios-prod:
    name: iOS — Prod → App Store review
    needs: [validate, version]
    runs-on: macos-15
    environment: prod
    if: >-
      vars.IOS_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          setup-ruby: "true"
          cache: "false"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync App Store certificates via Match
        run: bundle exec fastlane ios sync_appstore_certs flavor:prod
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Build IPA — prod
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BUILD_NAME: ${{ needs.version.outputs.version }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          flutter build ipa \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --build-number="$(( GITHUB_RUN_NUMBER + ${BUILD_NUMBER_OFFSET:-0} ))" \
            --build-name="$BUILD_NAME" \
            --release \
            --export-options-plist=ios/ExportOptionsProd.plist

      - name: Upload debug symbols to Sentry
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-prod-r${{ github.run_number }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 90

      - name: Submit to App Store review
        run: bundle exec fastlane ios deploy_prod
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

  # ─── Release ────────────────────────────────────────────────────────────────
  # Kept in this file: actions/download-artifact only reads artifacts from the
  # current run.
  release:
    name: Create GitHub Release
    needs: [android-prod, ios-prod]
    # ios-prod is skipped while iOS is disabled; still release if Android shipped.
    if: >-
      always() && github.event_name == 'push' &&
      needs.android-prod.result == 'success' &&
      (needs.ios-prod.result == 'success' || needs.ios-prod.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          prerelease: false
