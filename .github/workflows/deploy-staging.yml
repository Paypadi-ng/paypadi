name: Paypadi Deploy — Staging

# Release candidates. `staging` is updated only by promotion PRs from `main`
# (or a hotfix PR). Each push builds the *prod* flavor — the same app ID and
# code path that ships — against the staging environment's backend and
# distributes it to QA via Firebase App Distribution.
# The `staging` environment only accepts deployments from `staging`.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        required: true
        default: all
        options: [all, android, ios]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  # ─── Validation ─────────────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/validate.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Android ────────────────────────────────────────────────────────────────
  android-staging:
    name: Android — Staging
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          setup-java: "true"
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key-prod.properties

      - name: Build App Bundle — staging
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=DEPLOY_ENV=staging \
            --build-number="$BUILD_NUMBER" \
            --release

      - name: Upload debug symbols to Sentry
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-staging-r${{ github.run_number }}.aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 14

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-credentials.json"

      - name: Deploy to Firebase App Distribution
        run: bundle exec fastlane android deploy_firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_GROUPS: qa-testers
          RELEASE_NOTES: "Staging build r${{ github.run_number }} (${{ github.sha }})"
          ARTIFACT_PATH: build/app/outputs/bundle/prodRelease/app-prod-release.aab

  # ─── iOS ────────────────────────────────────────────────────────────────────
  # Disabled until IOS_DEPLOY_ENABLED is 'true' (see deploy-dev.yml).
  ios-staging:
    name: iOS — Staging
    needs: validate
    runs-on: macos-15
    environment: staging
    if: >-
      vars.IOS_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          setup-ruby: "true"

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Match's development profiles cover com.paypadi as well as
      # com.paypadi.dev (see fastlane/Matchfile), which is what Firebase
      # App Distribution needs for registered QA devices.
      - name: Sync certificates via Match
        run: bundle exec fastlane ios sync_dev_certs
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Build IPA — staging
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build ipa \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=DEPLOY_ENV=staging \
            --build-number="$BUILD_NUMBER" \
            --release \
            --export-options-plist=ios/ExportOptionsStaging.plist

      - name: Upload debug symbols to Sentry
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paypadi-staging-r${{ github.run_number }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-credentials.json"

      - name: Deploy to Firebase App Distribution
        run: bundle exec fastlane ios deploy_firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_GROUPS: qa-testers
          RELEASE_NOTES: "Staging build r${{ github.run_number }} (${{ github.sha }})"
