version: 2

updates:
  # Flutter/Dart packages
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Don't adopt a release until it has been public for a week — gives the
    # ecosystem time to catch a compromised or broken publish.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # GitHub Actions (workflows + local composite actions). Actions are pinned
  # by commit SHA; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]

  # Fastlane and its plugins
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      fastlane:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
