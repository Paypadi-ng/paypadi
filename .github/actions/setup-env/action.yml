name: 'Setup PayPadi Environment'
description: 'Sets up Flutter, Java, Ruby, and handles caching'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '17'
  ruby-version:
    description: 'Ruby version to use (for Fastlane/iOS)'
    required: false
    default: '3.2'
  setup-java:
    description: 'Whether to setup Java (for Android)'
    required: false
    default: 'false'
  setup-ruby:
    description: 'Whether to setup Ruby (for Fastlane/iOS)'
    required: false
    default: 'false'
  cache:
    description: >-
      Whether to restore/save dependency caches. Release (prod) builds pass
      'false' so a poisoned cache can never end up in a store binary.
    required: false
    default: 'true'
  working-directory:
    description: 'Path to the Flutter project root'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Setup Java
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache == 'true' && 'gradle' || '' }}

    # Flutter is installed straight from the official repo at the exact
    # version pinned in pubspec.yaml (environment.flutter). This avoids
    # third-party setup actions, which may call unpinned actions internally
    # and are rejected by the repo's SHA-pinning policy.
    - name: Resolve Flutter version
      id: flutter
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        VERSION=$(awk '/^environment:/{e=1; next} /^[^ #]/{e=0} e && /^  flutter:/{print $2}' pubspec.yaml | tr -d "\"'")
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::pubspec.yaml must pin environment.flutter to an exact version (got '$VERSION')"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "root=$RUNNER_TOOL_CACHE/flutter-$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Flutter SDK
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.flutter.outputs.root }}
        key: ${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.flutter.outputs.version }}

    - name: Install Flutter ${{ steps.flutter.outputs.version }}
      shell: bash
      env:
        FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
        FLUTTER_ROOT_DIR: ${{ steps.flutter.outputs.root }}
      # GITHUB_PATH gets $RUNNER_TOOL_CACHE/flutter-<X.Y.Z>/bin only; the
      # version is validated as digits and dots above, and no workflow here
      # runs on pull_request_target.
      run: | # zizmor: ignore[github-env]
        if [[ ! -x "$FLUTTER_ROOT_DIR/bin/flutter" ]]; then
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$FLUTTER_ROOT_DIR"
        fi
        echo "$FLUTTER_ROOT_DIR/bin" >> "$GITHUB_PATH"
        "$FLUTTER_ROOT_DIR/bin/flutter" config --no-analytics >/dev/null
        "$FLUTTER_ROOT_DIR/bin/dart" --disable-analytics >/dev/null
        "$FLUTTER_ROOT_DIR/bin/flutter" --version

    # Only the pub download cache. .dart_tool/ must NOT be cached: it holds
    # build_runner's asset graph, and a restored graph makes build_runner skip
    # regenerating gitignored outputs (e.g. flutter_gen's lib/config/gen/*)
    # that don't exist in a fresh checkout.
    - name: Cache pub packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-v2-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pub-v2-

    - name: Setup Ruby + Bundler
      if: inputs.setup-ruby == 'true'
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: ${{ inputs.cache == 'true' }}
        working-directory: ${{ inputs.working-directory }}

    - name: Install Ruby gems (no cache)
      if: inputs.setup-ruby == 'true' && inputs.cache != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bundle install --jobs 4

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get --enforce-lockfile
