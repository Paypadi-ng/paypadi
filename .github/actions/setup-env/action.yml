name: 'Setup PayPadi Environment'
description: 'Sets up Flutter, Java, Ruby, and handles caching'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '17'
  ruby-version:
    description: 'Ruby version to use (for Fastlane/iOS)'
    required: false
    default: '3.2'
  setup-java:
    description: 'Whether to setup Java (for Android)'
    required: false
    default: 'false'
  setup-ruby:
    description: 'Whether to setup Ruby (for Fastlane/iOS)'
    required: false
    default: 'false'
  cache:
    description: >-
      Whether to restore/save dependency caches. Release (prod) builds pass
      'false' so a poisoned cache can never end up in a store binary.
    required: false
    default: 'true'
  working-directory:
    description: 'Path to the Flutter project root'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Setup Java
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache == 'true' && 'gradle' || '' }}

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: ${{ inputs.working-directory }}/pubspec.yaml
        channel: stable
        cache: ${{ inputs.cache == 'true' }}

    - name: Cache pub packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.pub-cache
          ${{ inputs.working-directory }}/.dart_tool
        key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Setup Ruby + Bundler
      if: inputs.setup-ruby == 'true'
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: ${{ inputs.cache == 'true' }}
        working-directory: ${{ inputs.working-directory }}

    - name: Install Ruby gems (no cache)
      if: inputs.setup-ruby == 'true' && inputs.cache != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bundle install --jobs 4

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get --enforce-lockfile
