# ─────────────────────────────────────────────────────────────────────────────
# Paypadi — Flutter 3.x · Dart SDK ^3.9.0 · flutter_lints ^6.0.0
#
# Philosophy: production-grade fintech. Catch real bugs at analysis time;
# prioritise crash resilience, null safety, and async correctness.
#
# Stack: Riverpod v3 · flutter_hooks · Freezed · AutoRoute v11 ·
#        Retrofit + Dio · Talker · flutter_screenutil
#
# Riverpod-specific rules (provider lifecycle, ref.watch placement, etc.) are
# enforced by riverpod_lint via custom_lint — this file handles everything else.
#
# Severity levels:
#   error   → blocks CI, must fix
#   warning → visible in IDE, does not block CI
#   ignore  → suppressed (code-gen false positives only)
# ─────────────────────────────────────────────────────────────────────────────

include: package:flutter_lints/flutter.yaml

# ─── Analyzer ────────────────────────────────────────────────────────────────

analyzer:
  language:
    strict-casts: true        # No silent dynamic → T casts
    strict-inference: true    # No inferred dynamic types
    strict-raw-types: true    # No List without List<T>

  errors:
    # ── Silence code-gen false positives ────────────────────────────────────
    invalid_annotation_target: ignore   # Freezed / json_serializable
    missing_return: ignore              # Freezed generated code triggers this

    # ── Real issues that should block CI ────────────────────────────────────
    avoid_dynamic_calls: error          # No untyped method calls
    always_use_package_imports: error   # Enforces clean layer boundaries
    dead_code: warning

  

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gen.dart"
    - "**/*.mocks.dart"
    - "lib/gen/**"                    # flutter_gen output (AppAssets, AppColors)
    - "lib/generated/**"
    - "test/.test_coverage.dart"
    - "build/**"

# ─── Formatter ───────────────────────────────────────────────────────────────

formatter:
  trailing_commas: preserve

# ─── Lint Rules ──────────────────────────────────────────────────────────────

linter:
  rules:

    # ════════════════════════════════════════════════════════════════════════
    # CORRECTNESS
    # ════════════════════════════════════════════════════════════════════════

    # Futures & async — Riverpod notifiers, Retrofit calls, service layer
    unawaited_futures: true       # Fire-and-forget futures hide errors
    discarded_futures: true       # Discarded futures are silent failures
    avoid_void_async: true        # async functions must return Future<T>

    # Stream hygiene — StreamController (AppToastChannel), Dio response streams
    cancel_subscriptions: true    # Uncancelled StreamSubscriptions leak memory
    close_sinks: true             # StreamControllers must be closed

    # Never swallow Errors (only catch Exceptions in AppException hierarchy)
    avoid_catching_errors: true

    # Regex safety — phone / plate / card number validators
    valid_regexps: true

    # Type safety
    avoid_dynamic_calls: true
    avoid_type_to_string: true

    # Null safety hygiene
    unnecessary_null_checks: true
    unnecessary_null_aware_assignments: true
    prefer_void_to_null: true     # Prefer void over Null for unused return types

    # ════════════════════════════════════════════════════════════════════════
    # STYLE
    # ════════════════════════════════════════════════════════════════════════

    # Imports — enforces clean feature / core / config layer separation
    always_use_package_imports: true  # No ../../core/... relative paths
    directives_ordering: true         # dart: → package: → relative

    # Strings
    prefer_single_quotes: true

    # Functions
    avoid_positional_boolean_parameters: true  # transfer(true, false) is unreadable
    avoid_bool_literals_in_conditional_expressions: true

    # Classes & constructors
    sort_constructors_first: true     # Constructor always at top of class

    # Members
    always_put_required_named_parameters_first: true
    prefer_final_fields: true         # Immutability by default; aligns with Freezed states

    # Returns
    always_declare_return_types: true # No implicit dynamic returns

    # Dart 3 — super-initialiser parameters in widget / model constructors
    use_super_parameters: true

    # Comments
    slash_for_doc_comments: true      # /// not /* */

    # ════════════════════════════════════════════════════════════════════════
    # PERFORMANCE
    # ════════════════════════════════════════════════════════════════════════

    # Widget rebuilds — const widgets skip the rebuild cycle entirely
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true  # Container() with no args = noise
    sized_box_for_whitespace: true      # SizedBox over Container for spacing
    sized_box_shrink_expand: true
    use_colored_box: true               # ColoredBox instead of Container(color: ...)

    # Collections
    prefer_collection_literals: true    # [] over List(), {} over Map()
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_iterable_whereType: true

    # Unnecessary code
    avoid_redundant_argument_values: true
    avoid_unused_constructor_parameters: true
    unnecessary_await_in_return: true
    unnecessary_lambdas: true
    unnecessary_late: true
    unnecessary_overrides: true
    unnecessary_parenthesis: true
    unnecessary_string_escapes: true
    unnecessary_string_interpolations: true
    unnecessary_to_list_in_spreads: true

    # ════════════════════════════════════════════════════════════════════════
    # FLUTTER
    # ════════════════════════════════════════════════════════════════════════

    # No BuildContext usage after await — especially important with flutter_hooks
    use_build_context_synchronously: true

    # Always accept Key in widget constructors (tree diffing + testing)
    use_key_in_widget_constructors: true

    use_full_hex_values_for_flutter_colors: true

    # No print() in production — use Talker
    avoid_print: true

    # ════════════════════════════════════════════════════════════════════════
    # EXPLICITLY DISABLED (with reasoning)
    # ════════════════════════════════════════════════════════════════════════

    # Freezed generates non-const constructors — produces constant false positives
    prefer_const_constructors_in_immutables: false

    # Repository / service abstractions are intentionally single-method
    one_member_abstracts: false

    # AppColors, AppAssets, and environment config classes are legitimately
    # static-only; flagging them adds noise without benefit
    avoid_classes_with_only_static_members: false

    # Too opinionated — Riverpod provider chains and widget trees read more
    # clearly as explicit statements than as cascade notation
    cascade_invocations: false

    # flutter_hooks returns mutable refs (useTextEditingController, useState,
    # useRef) — enforcing final locals conflicts with hook reassignment patterns
    prefer_final_locals: false

    # Dependency grouping by concern is more readable than alphabetical order
    sort_pub_dependencies: false